# Alembic configuration for the Hub's *V2* PostgreSQL schema (DATABASE_URL_V2:
# tabs, components, content_links, bot management, ...). The legacy
# DATABASE_URL database is not managed here.
#
# Usage (from renphil-hub-backend, with DATABASE_URL_V2 set or in .env):
#   alembic upgrade head        # safe on new and existing databases
#   alembic current             # show the applied revision
# See migrations_v2/README.md.

[alembic]
script_location = %(here)s/migrations_v2
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
